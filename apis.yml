aid: fintor
name: Fintor
description: Fintor is an enterprise software company that provides an agentic AI workforce
  for mortgage lending operations. Its purpose-built, autonomous AI agents execute mortgage
  workflows end to end - from application through closing - with human-in-the-loop oversight,
  integrating with existing loan origination systems (LOS), CRMs, and contact centers
  rather than replacing them. Product modules include a Loan Officer Assistant (document
  intake, borrower communication, gap analysis), a Processor Assistant (third-party orders,
  condition tracking, disclosures), Predictive Conditioning, a Closing Agent, and a Manager
  Assistant for forecasting and reporting. Fintor ships pre-built connectors for Encompass,
  Salesforce, Five9, Polly, and Blend, exposes documented API integrations, and is SOC 2
  Type II certified with encryption, RBAC, approval chains, and audit logging.
